name: Deploy

# Deploys API Worker + Pages on every push to main when Cloudflare secrets exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Cloudflare secrets are not set; skipping deploy."
            exit 0
          fi
          # Verify the token can actually authenticate before attempting a deploy.
          # A missing/expired/under-scoped token should skip the deploy cleanly
          # (green), not fail the pipeline. Real deploys resume once it is valid.
          if npx --yes wrangler@4.110.0 whoami >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN is set but failed to authenticate (expired or missing permissions). Update the token secret to enable auto-deploy. See SETUP.md."
          fi

      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.creds.outputs.ready == 'true'
        name: Apply D1 migrations
        run: pnpm --filter @rowhouse/api db:migrate:remote
        continue-on-error: true

      - if: steps.creds.outputs.ready == 'true'
        name: Deploy web (Pages)
        run: pnpm run deploy:web

      # Best-effort: the API Worker deploy needs R2/D1/KV provisioned in the
      # account. Don't fail the pipeline (and block the public site) if the
      # backend infra isn't ready yet; the step's log surfaces any error.
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy API (Worker)
        run: pnpm run deploy:api
        continue-on-error: true
