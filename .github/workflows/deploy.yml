name: Deploy

# Deploys API Worker + Pages on every push to main when a working Cloudflare
# token exists. Without one, the credentials job passes and the deploy job is
# reported as skipped, so the run stays green and says why in its summary.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  credentials:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # No checkout and no dependency cache here: this job only asks Cloudflare
      # whether the token works, so there is nothing to cache or clean up when
      # the deploy is skipped.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify token
        id: creds
        run: |
          skip() {
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::$1"
            {
              echo "### Deploy skipped"
              echo
              echo "$1"
              echo
              echo "See SETUP.md, section \"CI auto-deploy\", to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            skip "The CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is not set."
          fi
          # A missing, expired or under-scoped token skips the deploy cleanly
          # instead of failing the pipeline. Real deploys resume once it is valid.
          if ! npx --yes wrangler@4.110.0 whoami >/dev/null 2>&1; then
            skip "CLOUDFLARE_API_TOKEN is set but failed to authenticate (expired or missing permissions)."
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Cloudflare token authenticated; deploying." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build and deploy
    needs: credentials
    if: needs.credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        run: pnpm --filter @rowhouse/api db:migrate:remote
        continue-on-error: true

      - name: Deploy web (Pages)
        run: pnpm run deploy:web

      # Verify the live site still serves Markdown, llms.txt, the sitemap,
      # JSON-LD, and the trust pages agents rely on.
      - name: Verify agent readiness
        run: pnpm --filter @rowhouse/web run agent:check https://rowhouse-gg.pages.dev

      # Best-effort: the API Worker deploy needs R2/D1/KV provisioned in the
      # account. Don't fail the pipeline (and block the public site) if the
      # backend infra isn't ready yet; the step's log surfaces any error.
      - name: Deploy API (Worker)
        run: pnpm run deploy:api
        continue-on-error: true
