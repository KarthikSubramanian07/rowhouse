name: Deploy

# Deploys API Worker + Pages on every push to main when Cloudflare secrets exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets missing; skipping deploy."
          fi

      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.creds.outputs.ready == 'true'
        name: Apply D1 migrations
        run: pnpm --filter @rowhouse/api db:migrate:remote
        continue-on-error: true

      - if: steps.creds.outputs.ready == 'true'
        name: Deploy web (Pages)
        run: pnpm run deploy:web

      # Best-effort: the API Worker deploy needs R2/D1/KV provisioned in the
      # account. Don't fail the pipeline (and block the public site) if the
      # backend infra isn't ready yet; the step's log surfaces any error.
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy API (Worker)
        run: pnpm run deploy:api
        continue-on-error: true
